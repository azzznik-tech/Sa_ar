<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#151f1c;
    --ink-2:#1e2b27;
    --paper:#ece4d1;
    --paper-2:#f4eede;
    --wine:#7a2e2e;
    --wine-2:#9a3d3d;
    --gold:#b08d57;
    --line:rgba(236,228,209,.14);
    --text-dim:#c9c2ad;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Tajawal',sans-serif;
    line-height:1.65;
  }
  h1,h2,h3,.brand{font-family:'Amiri',serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 28px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;gap:12px;
  }
  .brand{font-size:1.6rem;font-weight:700;letter-spacing:.5px;}
  .brand span{color:var(--gold);}
  #auth-area{display:flex;align-items:center;gap:10px;}
  .btn{
    border:1px solid var(--line);background:transparent;color:var(--paper);
    padding:9px 18px;border-radius:3px;font-size:.92rem;transition:.2s;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;}
  .btn.primary:hover{background:var(--wine-2);color:#fff;}
  .btn.small{padding:5px 12px;font-size:.8rem;}
  .btn.danger{border-color:#8a3a3a;color:#e0a3a3;}
  .btn.danger:hover{background:#4a1f1f;border-color:#4a1f1f;color:#fff;}

  main{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
  .lead{color:var(--text-dim);max-width:60ch;margin:0 0 34px;font-size:.98rem;}

  #admin-panel{
    background:var(--ink-2);border:1px solid var(--line);border-radius:4px;
    padding:22px;margin-bottom:40px;display:none;
  }
  #admin-panel h2{margin:0 0 16px;font-size:1.2rem;}
  #admin-panel form{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
  #admin-panel .full{grid-column:1/-1;}
  #admin-panel label{display:block;font-size:.82rem;color:var(--text-dim);margin-bottom:5px;}
  #admin-panel input[type=text],#admin-panel textarea{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:9px 11px;border-radius:3px;font-family:inherit;font-size:.92rem;
  }
  #admin-panel textarea{resize:vertical;min-height:70px;}
  #admin-panel input[type=file]{color:var(--text-dim);font-size:.85rem;}

  #grid{
    display:grid;gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  }
  .card{
    background:var(--paper);color:var(--ink);border-radius:2px;
    display:flex;flex-direction:column;overflow:hidden;
    border-inline-end:5px solid var(--wine);
    position:relative;
  }
  .cover{
    aspect-ratio:3/4;width:100%;object-fit:cover;background:var(--paper-2);
    display:block;
  }
  .cover-empty{
    aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
    background:var(--paper-2);font-family:'Amiri',serif;font-size:2.2rem;color:var(--wine);
  }
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-title{font-family:'Amiri',serif;font-size:1.15rem;font-weight:700;margin:0;}
  .card-author{font-size:.82rem;color:#5a5346;}
  .stars{font-size:.95rem;color:var(--gold);letter-spacing:2px;}
  .stars .count{font-size:.75rem;color:#7a7360;letter-spacing:0;margin-inline-start:6px;}
  .card-desc{font-size:.85rem;color:#3a352a;margin:2px 0 4px;}
  .card-actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;}
  .rate-row{display:flex;gap:3px;cursor:pointer;font-size:1.1rem;color:#cbbf9c;}
  .rate-row span.active{color:var(--wine);}
  .admin-controls{position:absolute;top:8px;left:8px;display:flex;gap:6px;}
  .icon-btn{
    background:rgba(21,31,28,.75);border:none;color:#f0e9d8;width:28px;height:28px;
    border-radius:3px;font-size:.85rem;display:flex;align-items:center;justify-content:center;
  }

  .comments{border-top:1px solid rgba(0,0,0,.08);margin-top:8px;padding-top:8px;}
  .comment{font-size:.82rem;margin-bottom:6px;color:#3a352a;}
  .comment b{color:var(--wine);font-weight:700;}
  .comment-form{display:flex;gap:6px;margin-top:8px;}
  .comment-form input{
    flex:1;border:1px solid #d8cdac;background:#fff;border-radius:3px;padding:6px 9px;font-size:.82rem;
  }

  #empty-state{color:var(--text-dim);text-align:center;padding:60px 20px;font-size:.95rem;}

  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(10,14,12,.7);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:var(--ink-2);border:1px solid var(--line);border-radius:5px;
    padding:26px;width:100%;max-width:360px;
  }
  .modal h3{margin:0 0 16px;}
  .modal input{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:10px 12px;border-radius:3px;margin-bottom:10px;font-family:inherit;font-size:.92rem;
  }
  .modal .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .modal .tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:8px;border-radius:3px;}
  .modal .tabs button.active{border-color:var(--gold);color:var(--gold);}
  .msg{font-size:.8rem;margin-top:8px;min-height:16px;}
  .msg.err{color:#e0a3a3;}
  .msg.ok{color:#a8c9a0;}
  .close-x{position:absolute;top:14px;left:16px;background:none;border:none;color:var(--text-dim);font-size:1.1rem;}
  .modal{position:relative;}
</style>
</head>
<body>

<header>
  <div class="brand">مكتبت<span>ي</span></div>
  <div id="auth-area">
    <button class="btn" id="login-btn">تسجيل الدخول</button>
  </div>
</header>

<main>
  <p class="lead">مجموعة كتب للقراءة والتحميل. سجّل الدخول لتتمكن من تقييم الكتب وإضافة تعليقاتك.</p>

  <section id="admin-panel">
    <h2>إضافة كتاب جديد</h2>
    <form id="add-book-form">
      <div>
        <label>عنوان الكتاب</label>
        <input type="text" id="f-title" required>
      </div>
      <div>
        <label>المؤلف</label>
        <input type="text" id="f-author">
      </div>
      <div class="full">
        <label>نبذة عن الكتاب</label>
        <textarea id="f-desc"></textarea>
      </div>
      <div>
        <label>صورة الغلاف (اختياري)</label>
        <input type="file" id="f-cover" accept="image/*">
      </div>
      <div>
        <label>ملف الكتاب (PDF وغيره)</label>
        <input type="file" id="f-file" required>
      </div>
      <div class="full">
        <button type="submit" class="btn primary" id="add-book-btn">إضافة الكتاب</button>
        <span class="msg" id="add-book-msg"></span>
      </div>
    </form>
  </section>

  <div id="grid"></div>
  <div id="empty-state" style="display:none;">لا توجد كتب حتى الآن.</div>
</main>

<!-- Auth modal -->
<div class="modal-bg" id="auth-modal-bg">
  <div class="modal">
    <button class="close-x" id="auth-close">✕</button>
    <div class="tabs">
      <button id="tab-login" class="active">دخول</button>
      <button id="tab-register">حساب جديد</button>
    </div>
    <h3 id="auth-title">تسجيل الدخول</h3>
    <input type="text" id="auth-email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input type="password" id="auth-pass" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="btn primary" id="auth-submit" style="width:100%;">دخول</button>
    <div class="msg" id="auth-msg"></div>
  </div>
</div>

<script>
/* ====== إعدادات Supabase — عدّل هذين السطرين ====== */
const SUPABASE_URL = 'https://xuqfgdexytvutxaqvfme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HkW4U730oCHr2qpucKJwpg_VEYBX6iz';
const ADMIN_EMAIL = 'azzznik@gmail.com';
/* ================================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let isAdmin = false;

const $ = (id) => document.getElementById(id);

/* ---------- المصادقة ---------- */
async function refreshAuthState(){
  const { data } = await sb.auth.getUser();
  currentUser = data?.user || null;
  isAdmin = !!(currentUser && currentUser.email === ADMIN_EMAIL);
  renderAuthArea();
  $('admin-panel').style.display = isAdmin ? 'block' : 'none';
  loadBooks();
}

function renderAuthArea(){
  const area = $('auth-area');
  if(currentUser){
    area.innerHTML = `<button class="btn small" id="logout-btn">تسجيل الخروج</button>`;
    $('logout-btn').onclick = async () => { await sb.auth.signOut(); refreshAuthState(); };
  } else {
    area.innerHTML = `<button class="btn" id="login-btn">تسجيل الدخول</button>`;
    $('login-btn').onclick = openAuthModal;
  }
}

function openAuthModal(){ $('auth-modal-bg').style.display = 'flex'; }
$('auth-close').onclick = () => $('auth-modal-bg').style.display = 'none';

let authMode = 'login';
$('tab-login').onclick = () => setAuthMode('login');
$('tab-register').onclick = () => setAuthMode('register');
function setAuthMode(mode){
  authMode = mode;
  $('tab-login').classList.toggle('active', mode==='login');
  $('tab-register').classList.toggle('active', mode==='register');
  $('auth-title').textContent = mode==='login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
  $('auth-submit').textContent = mode==='login' ? 'دخول' : 'إنشاء الحساب';
  $('auth-msg').textContent = '';
}

$('auth-submit').onclick = async () => {
  const email = $('auth-email').value.trim();
  const password = $('auth-pass').value;
  const msg = $('auth-msg');
  msg.className = 'msg';
  if(!email || !password){ msg.textContent = 'أدخل البريد وكلمة المرور'; msg.classList.add('err'); return; }

  if(authMode === 'login'){
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ msg.textContent = 'خطأ: ' + error.message; msg.classList.add('err'); return; }
  } else {
    const { error } = await sb.auth.signUp({ email, password });
    if(error){ msg.textContent = 'خطأ: ' + error.message; msg.classList.add('err'); return; }
    msg.textContent = 'تم إنشاء الحساب. تحقق من بريدك إن طُلب تأكيد.'; msg.classList.add('ok');
  }
  await refreshAuthState();
  $('auth-modal-bg').style.display = 'none';
  $('auth-email').value = ''; $('auth-pass').value = '';
};

/* ---------- تحميل وعرض الكتب ---------- */
async function loadBooks(){
  const { data: books, error } = await sb.from('books').select('*').order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  if(!books || books.length === 0){
    $('grid').innerHTML = '';
    $('empty-state').style.display = 'block';
    return;
  }
  $('empty-state').style.display = 'none';

  const { data: ratings } = await sb.from('ratings').select('book_id, rating, user_id');
  const { data: comments } = await sb.from('comments').select('id, book_id, content, created_at').order('created_at', { ascending:true });

  $('grid').innerHTML = books.map(b => renderCard(b, ratings || [], comments || [])).join('');

  books.forEach(b => attachCardHandlers(b.id));
}

function renderCard(b, ratings, comments){
  const bookRatings = ratings.filter(r => r.book_id === b.id);
  const avg = bookRatings.length ? (bookRatings.reduce((s,r)=>s+r.rating,0)/bookRatings.length) : 0;
  const myRating = currentUser ? (bookRatings.find(r => r.user_id === currentUser.id)?.rating || 0) : 0;
  const bookComments = comments.filter(c => c.book_id === b.id);

  const starsDisplay = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));

  const cover = b.cover_url
    ? `<img class="cover" src="${b.cover_url}" alt="${escapeHtml(b.title)}">`
    : `<div class="cover-empty">📖</div>`;

  const adminControls = isAdmin ? `
    <div class="admin-controls">
      <button class="icon-btn" data-action="delete" data-id="${b.id}" title="حذف">🗑</button>
    </div>` : '';

  const rateRow = currentUser ? `
    <div class="rate-row" data-id="${b.id}">
      ${[1,2,3,4,5].map(n => `<span data-n="${n}" class="${n<=myRating?'active':''}">★</span>`).join('')}
    </div>` : `<div style="font-size:.78rem;color:#7a7360;">سجّل الدخول للتقييم</div>`;

  const commentsHtml = bookComments.map(c => `<div class="comment">${escapeHtml(c.content)}</div>`).join('');

  const commentForm = currentUser ? `
    <div class="comment-form" data-id="${b.id}">
      <input type="text" placeholder="أضف تعليقًا…" maxlength="300">
      <button class="btn small" data-action="comment" data-id="${b.id}">إرسال</button>
    </div>` : '';

  return `
    <div class="card">
      ${adminControls}
      ${cover}
      <div class="card-body">
        <h3 class="card-title">${escapeHtml(b.title)}</h3>
        ${b.author ? `<div class="card-author">${escapeHtml(b.author)}</div>` : ''}
        <div class="stars">${starsDisplay}<span class="count">(${bookRatings.length})</span></div>
        ${b.description ? `<p class="card-desc">${escapeHtml(b.description)}</p>` : ''}
        ${rateRow}
        <div class="card-actions">
          <a class="btn small primary" href="${b.file_url}" download target="_blank" rel="noopener">تحميل</a>
        </div>
        <div class="comments">
          ${commentsHtml}
          ${commentForm}
        </div>
      </div>
    </div>`;
}

function attachCardHandlers(bookId){
  const card = document.querySelector(`.rate-row[data-id="${bookId}"]`);
  if(card){
    card.querySelectorAll('span').forEach(s => {
      s.onclick = () => submitRating(bookId, parseInt(s.dataset.n));
    });
  }
  const delBtn = document.querySelector(`.icon-btn[data-action="delete"][data-id="${bookId}"]`);
  if(delBtn){ delBtn.onclick = () => deleteBook(bookId); }

  const commentBtn = document.querySelector(`button[data-action="comment"][data-id="${bookId}"]`);
  if(commentBtn){
    commentBtn.onclick = () => {
      const wrap = document.querySelector(`.comment-form[data-id="${bookId}"]`);
      const input = wrap.querySelector('input');
      submitComment(bookId, input.value.trim(), input);
    };
  }
}

async function submitRating(bookId, rating){
  if(!currentUser) return;
  await sb.from('ratings').upsert({ book_id: bookId, user_id: currentUser.id, rating }, { onConflict: 'book_id,user_id' });
  loadBooks();
}

async function submitComment(bookId, content, inputEl){
  if(!content || !currentUser) return;
  const { error } = await sb.from('comments').insert({ book_id: bookId, user_id: currentUser.id, content });
  if(!error){ inputEl.value=''; loadBooks(); }
}

/* ---------- لوحة الأدمن: إضافة كتاب ---------- */
$('add-book-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!isAdmin) return;
  const btn = $('add-book-btn');
  const msg = $('add-book-msg');
  msg.className = 'msg'; msg.textContent = 'جارٍ الرفع…';
  btn.disabled = true;

  try{
    const title = $('f-title').value.trim();
    const author = $('f-author').value.trim();
    const description = $('f-desc').value.trim();
    const coverFile = $('f-cover').files[0];
    const bookFile = $('f-file').files[0];
    if(!title || !bookFile) throw new Error('العنوان وملف الكتاب مطلوبان');

    let cover_url = null;
    if(coverFile){
      const coverPath = `${Date.now()}_${coverFile.name}`;
      const { error: upErr } = await sb.storage.from('covers').upload(coverPath, coverFile);
      if(upErr) throw upErr;
      cover_url = sb.storage.from('covers').getPublicUrl(coverPath).data.publicUrl;
    }

    const filePath = `${Date.now()}_${bookFile.name}`;
    const { error: fileErr } = await sb.storage.from('book-files').upload(filePath, bookFile);
    if(fileErr) throw fileErr;
    const file_url = sb.storage.from('book-files').getPublicUrl(filePath).data.publicUrl;

    const { error: insertErr } = await sb.from('books').insert({
      title, author, description, cover_url, file_url, file_name: bookFile.name
    });
    if(insertErr) throw insertErr;

    msg.className = 'msg ok'; msg.textContent = 'تمت الإضافة بنجاح.';
    $('add-book-form').reset();
    loadBooks();
  } catch(err){
    msg.className = 'msg err'; msg.textContent = 'خطأ: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

async function deleteBook(bookId){
  if(!isAdmin) return;
  if(!confirm('حذف هذا الكتاب نهائيًا؟')) return;
  await sb.from('books').delete().eq('id', bookId);
  loadBooks();
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

/* ---------- بدء التشغيل ---------- */
sb.auth.onAuthStateChange(() => refreshAuthState());
refreshAuthState();
</script>
</body>
      </html>
